<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>客服回复幻觉检测</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 0 0 80px; background: #f6f7f9; color: #1f2933; line-height: 1.7;
       font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                    "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
header { background: linear-gradient(135deg, #1e3a5f 0%, #2d5a8c 100%); color: #fff; padding: 34px 32px 28px; }
header h1 { margin: 0 0 8px; font-size: 25px; }
header p { margin: 0; opacity: .85; font-size: 13.5px; }
main { max-width: 1180px; margin: 0 auto; padding: 0 24px; }
section { background: #fff; border-radius: 10px; padding: 20px 22px; margin-top: 20px;
          box-shadow: 0 1px 3px rgba(31,41,51,.08); }
h2 { font-size: 18px; margin: 0 0 14px; padding-bottom: 8px; border-bottom: 2px solid #e2e6ec; }
h2 .num { color: #2d5a8c; margin-right: 6px; }
h3 { font-size: 14.5px; margin: 20px 0 9px; color: #3e4c59; }
h4 { font-size: 13.5px; margin: 14px 0 6px; color: #52606d; }
p { margin: 0 0 10px; font-size: 13.5px; }
label { display: block; font-size: 13px; color: #3e4c59; margin-bottom: 5px; font-weight: 600; }
.hint { font-size: 12px; color: #9aa5b1; font-weight: 400; margin-left: 6px; }
input[type=text], input[type=password], textarea, select {
  width: 100%; padding: 9px 11px; border: 1px solid #cbd2d9; border-radius: 7px;
  font-family: inherit; font-size: 13.5px; background: #fff; color: #1f2933; }
textarea { font-family: ui-monospace, Consolas, "Courier New", monospace; font-size: 12.5px;
           line-height: 1.55; resize: vertical; }
input:focus, textarea:focus { outline: 2px solid #2d5a8c33; border-color: #2d5a8c; }
.grid { display: grid; gap: 14px; }
.grid.c3 { grid-template-columns: 2fr 1fr 1fr; }
@media (max-width: 820px) { .grid.c3 { grid-template-columns: 1fr; } }
.row { margin-bottom: 14px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
button { border: 0; border-radius: 7px; padding: 10px 20px; font-size: 14px; font-weight: 600;
         cursor: pointer; font-family: inherit; transition: all .15s; }
button:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: #2d5a8c; color: #fff; }
.btn-primary:hover:not(:disabled) { background: #24486f; }
.btn-secondary { background: #eef1f5; color: #3e4c59; }
.btn-secondary:hover:not(:disabled) { background: #e2e6ec; }
.msg { padding: 12px 16px; border-radius: 8px; font-size: 13px; margin-top: 12px; line-height: 1.75; }
.msg.error { background: #fdecea; border: 1px solid #f5c2be; color: #a5281b; }
.msg.warn { background: #fff8e1; border: 1px solid #f0d48a; color: #7a5b00; }
.msg.ok { background: #e9f6ee; border: 1px solid #b7e0c6; color: #2e7d4f; }
.msg.info { background: #eef4fb; border: 1px solid #c3d8ef; color: #24547f; }
.msg ul { margin: 6px 0 0; padding-left: 20px; }
.msg li { margin-bottom: 4px; }
.msg code, code { background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
.hidden { display: none !important; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 13px; }
.card { border-radius: 9px; padding: 15px 16px; background: #f8f9fb; border-left: 3px solid #2d5a8c; }
.card.bad { border-left-color: #d64545; background: #fdf7f6; }
.card.good { border-left-color: #3a9d5d; background: #f5faf7; }
.card .t { font-size: 12px; color: #7b8794; }
.card .v { font-size: 26px; font-weight: 650; margin: 3px 0 2px; font-variant-numeric: tabular-nums; }
.card.bad .v { color: #c0392b; }
.card.good .v { color: #2e7d4f; }
.card .h { font-size: 11.5px; color: #9aa5b1; }
table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 8px; }
th { background: #eef1f5; text-align: left; padding: 9px 12px; color: #3e4c59; }
td { padding: 9px 12px; border-top: 1px solid #eef1f5; vertical-align: top; }
.sev { display: inline-block; padding: 2px 9px; border-radius: 5px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.sev.S1 { background: #fdecea; color: #c0392b; }
.sev.S2 { background: #fff4e0; color: #a86a00; }
.sev.S3 { background: #eef1f5; color: #52606d; }
.sev.NONE { background: #e9f6ee; color: #2e7d4f; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; }
.filter { border: 1px solid #cbd2d9; background: #fff; border-radius: 20px; padding: 5px 14px;
          font-size: 13px; cursor: pointer; color: #3e4c59; font-family: inherit; transition: all .15s; }
.filter:hover { border-color: #2d5a8c; color: #2d5a8c; }
.filter.active { background: #2d5a8c; border-color: #2d5a8c; color: #fff; }
.cases { display: flex; flex-direction: column; gap: 12px; }
.case { border-radius: 9px; padding: 15px 17px; background: #fbfcfd; border-left: 4px solid #cbd2d9; }
.case.tp, .case.tn { border-left-color: #3a9d5d; background: #f7fbf8; }
.case.fp { border-left-color: #d64545; background: #fdf8f7; }
.case.fn { border-left-color: #e0a800; background: #fffdf5; }
.case-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
             margin-bottom: 11px; padding-bottom: 9px; border-bottom: 1px dashed #e2e6ec; }
.case-id { font-weight: 700; font-family: ui-monospace, Consolas, monospace; }
.spacer { flex: 1; }
.muted { font-size: 12.5px; color: #9aa5b1; }
.badge { padding: 2px 10px; border-radius: 5px; font-size: 12px; font-weight: 600; }
.badge.tp, .badge.tn { background: #e9f6ee; color: #2e7d4f; }
.badge.fp { background: #fdecea; color: #c0392b; }
.badge.fn { background: #fff4e0; color: #a86a00; }
.field { display: flex; gap: 11px; margin-bottom: 7px; font-size: 13px; }
.field .k { flex: 0 0 74px; color: #7b8794; font-size: 12.5px; padding-top: 1px; }
.field .v { flex: 1; word-break: break-word; }
.claims { margin: 0; padding-left: 18px; }
.claims li { margin-bottom: 4px; }
.claims li.bad .verdict { color: #c0392b; font-weight: 600; background: #fdecea; }
.claims li.ok .verdict { color: #2e7d4f; }
.verdict { font-size: 11.5px; margin-right: 5px; padding: 1px 6px; border-radius: 4px; background: #eef1f5; }
.evidence { font-size: 12px; color: #7b8794; margin-top: 2px; }
.progress-bar { height: 5px; background: #e2e6ec; border-radius: 3px; overflow: hidden; margin-top: 10px; }
.progress-bar > div { height: 100%; background: #2d5a8c; width: 0; transition: width .4s; }
/* 后端一次请求跑完整批检测，前端拿不到逐条进度。
   与其让进度条卡在某个假数值上，不如用不确定态如实表达"在跑，但不知道跑到哪了"。 */
.progress-bar.indeterminate > div {
  width: 35% !important; transition: none;
  animation: progress-slide 1.4s ease-in-out infinite;
}
@keyframes progress-slide {
  0%   { margin-left: -35%; }
  100% { margin-left: 100%; }
}
.report-head { background: #f8f9fb; border-radius: 8px; padding: 14px 16px; font-size: 13px; color: #52606d; }
footer { text-align: center; color: #9aa5b1; font-size: 12.5px; margin-top: 34px; }
details { margin-top: 12px; }
summary { cursor: pointer; font-size: 13px; color: #2d5a8c; font-weight: 600; }
</style>
</head>
<body>

<header>
  <h1>客服回复幻觉检测</h1>
  <p>填入回复数据与模型接口，后端调用大模型逐条比对，产出检测报表</p>
</header>

<main>

<!-- ==================== 输入 ==================== -->
<section>
  <h2>输入</h2>

  <div class="row">
    <label>回复数据（JSON 数组）<span class="hint">必需，格式同 task4_replies.json</span></label>
    <textarea id="repliesInput" rows="8" spellcheck="false"
      placeholder='[
  {
    "id": "case-1",
    "user_question": "你们支持30天无理由退货吗？",
    "system_reply": "支持的，我们全品类支持30天无理由退货，运费也由我们承担。",
    "knowledge_base": "退货政策：普通商品支持7天无理由退货，非质量问题退货运费由买家承担。"
  }
]'></textarea>
    <div class="actions" style="margin-top:9px">
      <button class="btn-secondary" id="loadSampleBtn" type="button">载入示例</button>
      <button class="btn-secondary" id="pickRepliesBtn" type="button">从文件导入</button>
      <button class="btn-secondary" id="clearRepliesBtn" type="button">清空</button>
      <input type="file" id="repliesFile" accept=".json,application/json" style="display:none">
      <span class="muted" id="repliesStat"></span>
    </div>
  </div>

  <details>
    <summary>可选：人工标注（提供了才算得出检出率）</summary>
    <div class="row" style="margin-top:11px">
      <textarea id="truthInput" rows="5" spellcheck="false"
        placeholder='[
  {"id": "case-1", "is_hallucination": true, "hallucination_type": "政策编造", "detail": "编造了更宽松的退货政策"}
]'></textarea>
      <div class="actions" style="margin-top:9px">
        <button class="btn-secondary" id="pickTruthBtn" type="button">从文件导入</button>
        <button class="btn-secondary" id="clearTruthBtn" type="button">清空</button>
        <input type="file" id="truthFile" accept=".json,application/json" style="display:none">
        <span class="muted" id="truthStat"></span>
      </div>
    </div>
  </details>

  <h3>模型接口</h3>
  <div class="grid c3">
    <div>
      <label>Base URL<span class="hint">要带各家自己的路径前缀</span></label>
      <input type="text" id="baseUrl" spellcheck="false" value="https://api.deepseek.com/v1">
    </div>
    <div>
      <label>模型名</label>
      <input type="text" id="model" spellcheck="false" value="deepseek-chat">
    </div>
    <div>
      <label>预设</label>
      <select id="preset">
        <option value="">— 选择后自动填入 —</option>
        <option value="https://api.deepseek.com/v1|deepseek-chat">DeepSeek</option>
        <option value="https://dashscope.aliyuncs.com/compatible-mode/v1|qwen-plus">通义千问</option>
        <option value="https://open.bigmodel.cn/api/paas/v4|glm-4-flash">智谱 GLM</option>
        <option value="https://api.moonshot.cn/v1|moonshot-v1-8k">Kimi</option>
        <option value="http://localhost:11434/v1|qwen2.5:7b">本地 Ollama</option>
        <option value="https://api.openai.com/v1|gpt-4o-mini">OpenAI 官方</option>
      </select>
    </div>
  </div>

  <div class="row" style="margin-top:14px">
    <label>API Key</label>
    <div style="display:flex; gap:8px">
      <input type="password" id="apiKey" spellcheck="false" autocomplete="off" placeholder="sk-...">
      <button class="btn-secondary" id="toggleKeyBtn" type="button" style="white-space:nowrap">显示</button>
    </div>
    <div class="muted" style="margin-top:6px">
      密钥随本次请求发给本机后端，由后端调用模型；不写入磁盘、不记日志、不缓存。
    </div>
  </div>

  <div class="actions" style="margin-top:14px">
    <button class="btn-secondary" id="testBtn" type="button">测试连接</button>
    <span class="muted">可选。只是探一下连通性，不影响下面的「开始检测」——不测也能直接跑</span>
  </div>

  <div id="configMsg"></div>
</section>

<!-- ==================== 执行 ==================== -->
<section>
  <h2>执行</h2>
  <div class="actions">
    <button class="btn-primary" id="runBtn" type="button">开始检测</button>
    <span class="muted" id="runStat"></span>
  </div>
  <div class="progress-bar"><div id="progressFill"></div></div>
  <div id="runMsg"></div>
</section>

<!-- ==================== 报表 ==================== -->
<section id="reportSection" class="hidden">
  <h2>检测报表</h2>
  <div class="report-head" id="reportHead"></div>
  <div id="reportBody"></div>
</section>

<footer>客服回复幻觉检测 · 单文件页面，由本机后端提供</footer>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

const SAMPLE_REPLIES = [
  {id: "case-1", user_question: "你们支持30天无理由退货吗？",
   system_reply: "支持的，我们全品类支持30天无理由退货，运费也由我们承担。您可以在订单详情页直接申请。",
   knowledge_base: "退货政策：普通商品支持7天无理由退货，质量问题30天内可退换。非质量问题退货运费由买家承担。"},
  {id: "case-2", user_question: "我的快递到哪了？",
   system_reply: "我帮您查了一下，您的包裹目前在南京转运中心，预计明天下午送达。如有变动会短信通知您。",
   knowledge_base: "无（客服系统未接入物流查询接口）"},
  {id: "case-3", user_question: "可以货到付款吗？",
   system_reply: "目前不支持货到付款，支持微信、支付宝和银行卡在线支付。",
   knowledge_base: "支付方式：微信支付、支付宝、银行卡、花呗、信用卡。不支持货到付款。"}
];

const VERDICT_LABELS = {
  SUPPORTED: "有据", CONTRADICTED: "与知识库冲突", UNSUPPORTED: "知识库无据",
  CONSISTENT_HEDGED: "语义一致", NON_FACTUAL: "非事实表述"
};
const HALLUCINATORY = new Set(["CONTRADICTED", "UNSUPPORTED"]);

let taxonomyCache = null;

// ===========================================================================
// 输入辅助
// ===========================================================================

function setMsg(el, kind, title, lines) {
  if (!kind) { el.innerHTML = ""; return; }
  let html = `<div class="msg ${kind}"><strong>${esc(title)}</strong>`;
  if (lines && lines.length) {
    html += "<ul>" + lines.map(l => `<li>${esc(l)}</li>`).join("") + "</ul>";
  }
  el.innerHTML = html + "</div>";
}

function countValid(text) {
  if (!text.trim()) return 0;
  try { const v = JSON.parse(text); return Array.isArray(v) ? v.length : -1; }
  catch { return -1; }
}

function updateStats() {
  const r = countValid($("repliesInput").value);
  $("repliesStat").textContent = r === 0 ? "" : r > 0 ? `已载入 ${r} 条` : "JSON 格式有误";
  const t = countValid($("truthInput").value);
  $("truthStat").textContent = t === 0 ? "" : t > 0 ? `已载入 ${t} 条` : "JSON 格式有误";
}

/** 每条回复必须齐备的四个字段，与后端 BatchRequestParser 的规则一致。 */
const REQUIRED_FIELDS = ["id", "user_question", "system_reply", "knowledge_base"];

/**
 * 逐条检查回复数据。
 *
 * 与后端同一套规则，只是为了让用户提交前就看到问题。**后端才是权威校验方**——
 * 任何人都能绕过页面直接调接口。
 *
 * 每个对象的问题合并成一条，而不是查到就报——否则用户得反复提交逐个试错。
 */
function findReplyProblems(items) {
  const problems = [];
  items.forEach((item, i) => {
    const at = `第 ${i + 1} 条`;
    if (item === null || typeof item !== "object" || Array.isArray(item)) {
      problems.push(`${at} 不是对象。每条回复必须是 {...} 包裹的对象。`);
      return;
    }
    const missing = [], wrongType = [];
    for (const field of REQUIRED_FIELDS) {
      const value = item[field];
      if (value === undefined || value === null) {
        missing.push(field);
      } else if (typeof value !== "string") {
        wrongType.push(field);
      } else if (!value.trim()) {
        missing.push(field + "（空字符串）");
      }
    }
    if (missing.length || wrongType.length) {
      const parts = [];
      if (missing.length) parts.push("缺少 " + missing.join("、"));
      if (wrongType.length) parts.push("这些字段必须是字符串：" + wrongType.join("、"));
      problems.push(`${at}：${parts.join("；")}。`);
    }
  });
  return problems;
}

/** 只收集模型接口部分，供「测试连接」使用。 */
function collectConnection() {
  const errors = [];
  const baseUrl = $("baseUrl").value.trim();
  const model = $("model").value.trim();
  const apiKey = $("apiKey").value.trim();

  if (!baseUrl) errors.push("Base URL 不能为空。");
  if (!model) errors.push("模型名不能为空。");
  if (!apiKey && !/localhost|127\.0\.0\.1/.test(baseUrl)) {
    errors.push("API key 不能为空（连本地模型时可留空，但 Base URL 要指向 localhost）。");
  }

  return {errors, body: {base_url: baseUrl, api_key: apiKey, model: model}};
}

/** 本地先拦一道，只为让用户早点看到问题；后端才是权威校验方。 */
function collectRequest() {
  const connection = collectConnection();
  const errors = [...connection.errors];

  const repliesText = $("repliesInput").value.trim();
  let replies = [];
  if (!repliesText) {
    errors.push("请填入待检测的回复数据。");
  } else {
    try {
      const parsed = JSON.parse(repliesText);
      if (!Array.isArray(parsed)) {
        errors.push("回复数据的顶层必须是数组。");
      } else if (parsed.length === 0) {
        errors.push("回复数据是空数组。");
      } else {
        replies = parsed;
        const problems = findReplyProblems(parsed);
        if (problems.length) {
          // 数据多的时候问题可能上百条，先展示一批——改完再校验会更快
          errors.push(...problems.slice(0, 10));
          if (problems.length > 10) {
            errors.push(`……还有 ${problems.length - 10} 条数据有同样的问题，先修这几条。`);
          }
        }
      }
    } catch (e) { errors.push("回复数据不是合法 JSON：" + e.message); }
  }

  const truthText = $("truthInput").value.trim();
  let groundTruth = null;
  if (truthText) {
    try {
      const parsed = JSON.parse(truthText);
      if (!Array.isArray(parsed)) errors.push("人工标注的顶层必须是数组。");
      else groundTruth = parsed;
    } catch (e) { errors.push("人工标注不是合法 JSON：" + e.message); }
  }

  return {errors, body: {
    base_url: connection.body.base_url,
    api_key: connection.body.api_key,
    model: connection.body.model,
    replies: replies,
    ground_truth: groundTruth,
  }};
}

// ---------------------------------------------------------------------------
// 进度条
//
// 后端一次请求跑完整批检测，前端拿不到逐条进度，所以用不确定态滑动动画，
// 如实表达"在跑，但不知道跑到哪了"。
//
// 这里踩过一个坑：重置进度条时只改了行内 width，忘了摘掉 indeterminate 类，
// 而那个类的样式带 !important —— 行内样式被压过，失败之后进度条会一直滑下去。
// 所以收尾一律走下面两个函数，保证"类"和"宽度"一起变。
// ---------------------------------------------------------------------------

function progressRunning() {
  $("progressFill").parentElement.classList.add("indeterminate");
}

function progressDone(percent) {
  $("progressFill").parentElement.classList.remove("indeterminate");
  $("progressFill").style.width = percent + "%";
}

// ===========================================================================
// 调用后端
// ===========================================================================

async function runDetection() {
  setMsg($("configMsg"), null);
  setMsg($("runMsg"), null);

  const {errors, body} = collectRequest();
  if (errors.length) {
    setMsg($("configMsg"), "error", "有 " + errors.length + " 处需要先修正", errors);
    return;
  }

  const btn = $("runBtn");
  btn.disabled = true;
  btn.textContent = "检测中…";
  progressRunning();
  $("runStat").textContent = `共 ${body.replies.length} 条，逐条调用模型，需要一些时间`;
  $("reportSection").classList.add("hidden");

  const started = Date.now();
  try {
    const response = await fetch("/api/detect/batch", {
      method: "POST",
      headers: {"Content-Type": "application/json; charset=utf-8"},
      body: JSON.stringify(body),
    });
    let payload = null;
    try { payload = await response.json(); } catch (_) { /* 非 JSON 响应 */ }

    if (!response.ok) {
      progressDone(0);
      $("runStat").textContent = "";
      renderFailure($("runMsg"), response.status, payload);
      return;
    }

    progressDone(100);
    $("runStat").textContent = `${body.replies.length} 条`;
    if (payload && payload.warnings && payload.warnings.length) {
      setMsg($("runMsg"), "warn", "检测完成，但有 " + payload.warnings.length + " 条提醒", payload.warnings);
    } else {
      setMsg($("runMsg"), "ok", "检测完成。");
    }
    await renderReport(payload.data, Date.now() - started);
  } catch (e) {
    progressDone(0);
    $("runStat").textContent = "";
    setMsg($("runMsg"), "error", "请求没能发到本机后端", [
      e.message,
      "确认后端还在运行；如果刚重启过，刷新页面重试。",
    ]);
  } finally {
    btn.disabled = false;
    btn.textContent = "开始检测";
  }
}

/**
 * 把后端返回的失败信息渲染成能照着做的提示。
 *
 * 只负责渲染，不碰进度条——进度归 runDetection 管，
 * 两处都改就容易漏掉一个（之前就是这么漏的）。
 */
function renderFailure(target, status, payload) {
  if (payload && Array.isArray(payload.errors)) {
    setMsg(target, "error", payload.message || "请求参数有问题", payload.errors);
    return;
  }
  if (payload && payload.message) {
    setMsg(target, "error", payload.message,
      [payload.detail, payload.hint].filter(Boolean));
    return;
  }
  setMsg(target, "error", `后端返回 HTTP ${status}`, ["没有可解析的错误信息。"]);
}

// ===========================================================================
// 报表渲染 —— 顺序：分类定义 / 检测方法 / 检出率 / AI 工具使用情况
// ===========================================================================

async function renderReport(data, elapsedMs) {
  const taxonomy = await loadTaxonomy();

  $("reportHead").innerHTML = `
    检测引擎：<code>${esc(data.engine)}</code><br>
    本批 ${data.total} 条 · 检出幻觉 ${data.detected} 条 · 判为干净 ${data.clean} 条 ·
    耗时 ${(elapsedMs / 1000).toFixed(1)} 秒`;

  let html = "";
  html += sectionTaxonomy(data, taxonomy);
  html += sectionMethod();
  html += sectionMetrics(data);
  html += sectionAiTooling(data);
  html += sectionCases(data);

  $("reportBody").innerHTML = html;
  $("reportSection").classList.remove("hidden");
  bindFilters();
  $("reportSection").scrollIntoView({behavior: "smooth", block: "start"});
}

async function loadTaxonomy() {
  if (taxonomyCache) return taxonomyCache;
  try {
    const r = await fetch("/api/taxonomy");
    taxonomyCache = await r.json();
  } catch (e) {
    taxonomyCache = {types: [], severities: []};
  }
  return taxonomyCache;
}

// ---- 一、幻觉分类定义 ----
function sectionTaxonomy(data, taxonomy) {
  let html = `<h2><span class="num">一</span>幻觉分类定义</h2>
    <p>分类轴取的是<b>出错对象</b>而不是"与知识库的偏离方式"——业务方拿到结论后需要直接知道
       该找谁处理。严重度是独立的横切维度，回答"有多严重"。</p>
    <table><thead><tr><th>类型</th><th>定义</th><th>本次检出</th></tr></thead><tbody>`;
  for (const t of (taxonomy.types || [])) {
    const count = (data.type_distribution || {})[t.label];
    html += `<tr><td><b>${esc(t.label)}</b></td><td>${esc(t.definition)}</td>
      <td>${count ? `<span class="sev S2">${count} 条</span>` : `<span class="muted">—</span>`}</td></tr>`;
  }
  html += `</tbody></table>`;

  html += `<h3>严重度（横切轴）</h3>
    <table><thead><tr><th>档位</th><th>判据</th><th>本次检出</th></tr></thead><tbody>`;
  for (const s of (taxonomy.severities || [])) {
    const count = (data.severity_distribution || {})[s.code];
    html += `<tr>
      <td><span class="sev ${esc(s.code)}">${esc(s.label)}</span> <code>${esc(s.code)}</code></td>
      <td>${esc(s.criterion)}</td>
      <td>${count ? `<span class="sev ${esc(s.code)}">${count} 条</span>` : `<span class="muted">—</span>`}</td>
    </tr>`;
  }
  html += `</tbody></table>
    <p class="muted">严重度由"类型基线 + 关键词上调"决定，只升不降：模型对严重度的判断不稳定，
       容易把高危案例说成"轻微"，因此不允许下调。</p>`;
  return html;
}

// ---- 二、检测方法 ----
function sectionMethod() {
  return `<h2><span class="num">二</span>检测方法</h2>
    <p>主检测器是 <b>规则前置 + 大模型断言级复核</b>：</p>
    <ol style="font-size:13.5px; padding-left:22px; margin:0 0 12px">
      <li><b>规则先跑</b>——知识库明示"未接入 / 不具备 / 未标注"这类案例，配合回复里的动作断言，
          用确定性规则判定，命中的直接返回，不再调用模型。</li>
      <li><b>其余交给大模型</b>——把回复拆成独立断言，逐条与知识库核对，结论分五档：
          <code>SUPPORTED</code>（有据）/ <code>CONTRADICTED</code>（与知识库冲突）/
          <code>UNSUPPORTED</code>（知识库沉默而回复断言）/
          <code>CONSISTENT_HEDGED</code>（语义一致，放行）/ <code>NON_FACTUAL</code>（非事实表述）。</li>
      <li><b>聚合</b>——只要有一条断言是 <code>CONTRADICTED</code> 或 <code>UNSUPPORTED</code>，
          整条回复即判为幻觉，并给出类型、严重度与逐条证据。</li>
    </ol>
    <h4>为什么拆到断言粒度</h4>
    <p>一条回复可能同时说对了 A、说错了 B。整体判定容易被"大体正确"主导从而漏检，逐条核对则不会。</p>
    <h4>判定口径里最关键的一条</h4>
    <p><code>UNSUPPORTED</code> 与 <code>CONSISTENT_HEDGED</code> 的分界，看回复有没有
       <b>保留知识库里的限定条件</b>：保留了（"基本""轻微""可能"）→ 放行；
       把限定抹平成确定性结论并给出相悖断言 → 判为幻觉。</p>
    <h4>失败即中止</h4>
    <p>模型不可用时整批中止，<b>不把失败的案例当成"没有幻觉"</b>——否则会产出一份格式完整、
       指标漂亮、实际全错的报告。任何一条失败都不会出具汇总指标。</p>
    <h4>并发</h4>
    <p>逐条串行太慢，后端用固定线程池并发调用模型（上限 4）。想让调用方自己调这个上限的话，
       把它提到请求参数里即可。</p>`;
}

// ---- 三、检出率 ----
function sectionMetrics(data) {
  let html = `<h2><span class="num">三</span>检出率</h2>`;

  if (!data.has_ground_truth) {
    return html + `<div class="msg info">
      <strong>本次未提供人工标注，因此不算检出率。</strong>
      没有标注就无从判断判得对不对。要评估漏检与误报，在上方「人工标注」栏填入对应数据后重新检测。
      <ul><li>本次共检测 ${data.total} 条，判为幻觉 ${data.detected} 条，判为干净 ${data.clean} 条。</li></ul>
    </div>`;
  }

  const m = data.metrics;
  html += `<div class="cards">
    ${card("准确率", fmt(m.accuracy), `正确判定 ${m.true_positive + m.true_negative} / ${data.total}`, "")}
    ${card("精确率", fmt(m.precision), "判为幻觉的里面有多少是真幻觉", "")}
    ${card("召回率", fmt(m.recall), "真幻觉里面抓到了多少", "")}
    ${card("F1", fmt(m.f1), "精确率与召回率的调和平均", "")}
    ${card("漏检", String(m.false_negative), "人工判幻觉、工具放过了", m.false_negative ? "bad" : "good")}
    ${card("误报", String(m.false_positive), "人工判干净、工具误伤了", m.false_positive ? "bad" : "good")}
  </div>`;

  const positives = m.true_positive + m.false_negative;
  const negatives = m.true_negative + m.false_positive;
  if (negatives > 0 && positives / data.total > 0.8) {
    html += `<div class="msg warn" style="margin-top:14px">
      <strong>注意这个数据集的分布：${positives} 正 : ${negatives} 负。</strong>
      <ul>
        <li>正负严重不平衡时，把所有样本都判成"有幻觉"也能拿到很高的准确率和 100% 召回率。</li>
        <li>因此请以<b>漏检数 / 误报数</b>为准，准确率只作参考。</li>
      </ul></div>`;
  }

  html += `<h3>漏检与误报</h3>`;
  html += idList("漏检（人工判幻觉，工具放过）", data.missed, data);
  html += idList("误报（人工判干净，工具误伤）", data.false_alarms, data);
  return html;
}

function idList(title, ids, data) {
  if (!ids || !ids.length) {
    return `<p style="font-size:13.5px"><b>${esc(title)}</b>：<span style="color:#3a9d5d">无</span></p>`;
  }
  let html = `<p style="font-size:13.5px; margin-bottom:4px"><b>${esc(title)}</b>：`
    + ids.map(id => `<code>${esc(id)}</code>`).join(" ") + `</p>`
    + `<ul style="font-size:13px; margin:0 0 12px">`;
  for (const id of ids) {
    const c = (data.cases || []).find(x => x.id === id);
    if (c) html += `<li><code>${esc(id)}</code> —— 工具说法：${esc(c.reason)}</li>`;
  }
  return html + `</ul>`;
}

// ---- 四、AI 工具使用情况 ----
function sectionAiTooling(data) {
  return `<h2><span class="num">四</span>AI 工具使用情况</h2>
    <p>本项目全程使用 AI 编程工具辅助开发。下面记录的是实际发生的事。</p>

    <h4>需求阶段：逐项确认判定口径</h4>
    <p>动手前先做了一轮设计评审，逐个确定分类体系、判定口径、检测架构、模型接入方式、评测口径。
       其中<b>分类轴被推翻重设计过一次</b>——最初按"知识库有无依据"分，套回数据发现多数案例的
       知识库恰好写了相反的值，整个分类会塌；改成按"出错对象"分四类。</p>

    <h4>用 AI 做事实核查，纠正了多个错误假设</h4>
    <p>关键技术前提没有靠记忆下结论，而是逐个查证官方文档与 jar 包内的实际内容：</p>
    <table><thead><tr><th>核查项</th><th>结果</th></tr></thead><tbody>
      <tr><td>Spring AI 版本兼容性</td><td>确认只有 2.0.x 支持 Spring Boot 4.x；1.0 / 1.1 只支持 3.5.x</td></tr>
      <tr><td>OpenAI 的 base-url 要不要带 <code>/v1</code></td>
          <td><b>要带</b>。配置值原样传给 SDK，SDK 只拼 <code>/chat/completions</code></td></tr>
      <tr><td>api-key 留空会怎样</td>
          <td><b>不会报错</b>。空值走无鉴权分支，意味着配错了要推迟到第一次调用才暴露</td></tr>
      <tr><td>配置里中文能否作 map 的键</td>
          <td><b>不能</b>。中文元素会被静默丢弃，抛出的却是"String 转 Map 失败"这种指错方向的错误</td></tr>
    </tbody></table>
    <p>其中"base-url 要不要带 <code>/v1</code>"和"空 key 会怎样"两项，
       <b>最初写进文档的说法都是错的</b>，是查了源码才纠正过来的。</p>

    <h4>实现阶段：先验证再断言</h4>
    <ul style="font-size:13.5px; padding-left:22px">
      <li>测试不依赖任何数据文件，全部用测试内构造的合成用例；集成测试只断言通用性质
          （每条都有结论、混淆矩阵平、空基线召回率必然为 100%）。</li>
      <li><b>测试替身抓出两个真 bug</b>：判为干净的案例会丢掉断言证据链；严重度升级词匹配的是
          整条回复而不是被判定为幻觉的那条断言。这两个跑真实模型时被数据"掩护"住了。</li>
      <li><b>重构后做了逐位回归</b>：配置外置、测试重写之后重跑全量数据，
          各检测器的指标与重构前完全一致。</li>
    </ul>

    <h4>本次检测使用的模型</h4>
    <p><code>${esc(data.engine)}</code> —— 由调用方在页面上指定。后端按请求临时构造客户端，
       地址与密钥用一次即弃，不落盘、不缓存、不记日志。</p>`;
}

// ---- 附录：逐条结果 ----
function sectionCases(data) {
  let html = `<h2><span class="num">附</span>逐条检测结果</h2><div class="filters">
    <button class="filter active" data-filter="all">全部 ${data.total}</button>
    <button class="filter" data-filter="hallucination">幻觉 ${data.detected}</button>
    <button class="filter" data-filter="clean">干净 ${data.clean}</button>`;
  if (data.has_ground_truth) {
    html += `<button class="filter" data-filter="fn">漏检 ${data.metrics.false_negative}</button>
             <button class="filter" data-filter="fp">误报 ${data.metrics.false_positive}</button>`;
  }
  html += `</div><div class="cases">`;

  for (const c of (data.cases || [])) {
    const outcome = (c.outcome || "").trim();
    const cls = {命中: "tp", 正确放行: "tn", 误报: "fp", 漏检: "fn"}[outcome] || "";

    html += `<article class="case ${cls}" data-kind="${bucketOf(c, outcome)}">
      <div class="case-head">
        <span class="case-id">${esc(c.id)}</span>
        ${outcome ? `<span class="badge ${cls}">${esc(outcome)}</span>` : ""}
        <span class="spacer"></span>
        ${c.truth ? `<span class="muted">人工标注：${
            c.truth.is_hallucination ? esc(c.truth.hallucination_type || "幻觉") : "干净"}</span>` : ""}
        ${c.hallucination
            ? `<span class="sev ${esc(c.severity)}">${esc(c.type_label)} · ${esc(c.severity)}</span>`
            : `<span class="sev NONE">判为干净</span>`}
      </div>`;

    html += field("检测理由", c.reason);
    if (c.claims && c.claims.length) {
      html += `<div class="field"><div class="k">断言核对</div><div class="v"><ul class="claims">`;
      for (const claim of c.claims) {
        const bad = HALLUCINATORY.has(claim.verdict);
        html += `<li class="${bad ? "bad" : "ok"}">
          <span class="verdict">${esc(VERDICT_LABELS[claim.verdict] || claim.verdict)}</span>${esc(claim.text)}
          ${claim.evidence ? `<div class="evidence">知识库依据：${esc(claim.evidence)}</div>` : ""}
        </li>`;
      }
      html += `</ul></div></div>`;
    }
    if (c.truth && c.truth.detail) html += field("人工标注理由", c.truth.detail);
    html += `</article>`;
  }
  return html + `</div>`;
}

function bucketOf(c, outcome) {
  if (outcome === "漏检") return "fn";
  if (outcome === "误报") return "fp";
  return c.hallucination ? "hallucination" : "clean";
}

function card(title, value, hint, tone) {
  return `<div class="card ${tone || ""}"><div class="t">${esc(title)}</div>
    <div class="v">${esc(value)}</div><div class="h">${esc(hint || "")}</div></div>`;
}
function field(key, value) {
  return `<div class="field"><div class="k">${esc(key)}</div><div class="v">${esc(value)}</div></div>`;
}
function fmt(v) { return (typeof v === "number" ? v : 0).toFixed(3); }

function bindFilters() {
  $("reportBody").querySelectorAll(".filter").forEach(btn => {
    btn.addEventListener("click", () => {
      const want = btn.dataset.filter;
      $("reportBody").querySelectorAll(".filter").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      $("reportBody").querySelectorAll(".case").forEach(el => {
        el.style.display = want === "all" || el.dataset.kind === want ? "" : "none";
      });
    });
  });
}

// 交互绑定

$("loadSampleBtn").addEventListener("click", () => {
  $("repliesInput").value = JSON.stringify(SAMPLE_REPLIES, null, 2);
  updateStats();
  setMsg($("configMsg"), "info", "已载入 3 条示例",
    ["第 3 条是正确回复，用于确认工具不会把所有回复都判成幻觉。"]);
});
$("clearRepliesBtn").addEventListener("click", () => { $("repliesInput").value = ""; updateStats(); });
$("clearTruthBtn").addEventListener("click", () => { $("truthInput").value = ""; updateStats(); });
$("pickRepliesBtn").addEventListener("click", () => $("repliesFile").click());
$("pickTruthBtn").addEventListener("click", () => $("truthFile").click());

function wireFile(inputId, targetId) {
  $(inputId).addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { $(targetId).value = reader.result; updateStats(); };
    reader.onerror = () => setMsg($("configMsg"), "error", "文件读取失败", [String(reader.error)]);
    reader.readAsText(file, "utf-8");
    e.target.value = "";
  });
}
wireFile("repliesFile", "repliesInput");
wireFile("truthFile", "truthInput");

$("repliesInput").addEventListener("input", updateStats);
$("truthInput").addEventListener("input", updateStats);

$("toggleKeyBtn").addEventListener("click", () => {
  const showing = $("apiKey").type === "text";
  $("apiKey").type = showing ? "password" : "text";
  $("toggleKeyBtn").textContent = showing ? "显示" : "隐藏";
});

$("preset").addEventListener("change", e => {
  if (!e.target.value) return;
  const [url, model] = e.target.value.split("|");
  $("baseUrl").value = url;
  $("model").value = model;
});

/**
 * 探测连通性。
 *
 * 走的是后端同一个客户端，所以这里报出来的错就是检测时会遇到的错——
 * 缺路径前缀、密钥不对、被限流，都会带上对应的排查提示。
 * 先探一次，免得跑完一批才发现配错。
 */
$("testBtn").addEventListener("click", async () => {
  setMsg($("configMsg"), null);

  const {errors, body} = collectConnection();
  if (errors.length) {
    setMsg($("configMsg"), "error", "模型接口配置有问题", errors);
    return;
  }

  const btn = $("testBtn");
  btn.disabled = true;
  btn.textContent = "测试中…";
  try {
    const response = await fetch("/api/llm/ping", {
      method: "POST",
      headers: {"Content-Type": "application/json; charset=utf-8"},
      body: JSON.stringify(body),
    });
    let payload = null;
    try { payload = await response.json(); } catch (_) { /* 非 JSON 响应 */ }

    if (!response.ok) {
      renderFailure($("configMsg"), response.status, payload);
      return;
    }

    const detail = [
      `模型：${payload.model}`,
      `实际请求地址：${payload.endpoint}`,
      `模型回应：${payload.reply}`,
    ];
    if (payload.warnings && payload.warnings.length) {
      setMsg($("configMsg"), "warn", "连接正常，但配置有需要留意的地方",
        [...detail, ...payload.warnings]);
    } else {
      setMsg($("configMsg"), "ok", "连接正常", detail);
    }
  } catch (e) {
    setMsg($("configMsg"), "error", "请求没能发到本机后端", [
      e.message,
      "确认后端还在运行。",
    ]);
  } finally {
    btn.disabled = false;
    btn.textContent = "测试连接";
  }
});

$("runBtn").addEventListener("click", runDetection);
updateStats();
</script>
