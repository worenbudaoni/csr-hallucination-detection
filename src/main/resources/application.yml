# ============================================================================
# 客服回复幻觉检测 —— 应用配置
#
# 【这里没有模型凭据配置】检测用的地址、密钥、模型名由调用方在页面上现填，
# 随请求发给本机后端，用完即弃。服务端不持有、不缓存任何凭据，
# 因此不需要 spring.ai.* 那套"启动时定死一家厂商"的配置。
#
# 【YAML 写法注意】凡是值里带冒号的（占位符 ${VAR:default} 和 optional:file:... 都算），
# 一律加引号。YAML 的普通标量里冒号后面跟空格会被解析成新的键值对。
# 正则用【单引号】，因为 YAML 单引号内的反斜杠是字面量。
# ============================================================================

spring:
  application:
    name: csr-hallucination-detection

  jackson:
    # 接口用 snake_case 输出，与数据文件（task4_replies.json 等）的字段风格保持一致，
    # 调用方不用在两套命名之间来回换算。
    property-naming-strategy: SNAKE_CASE

  # --------------------------------------------------------------------------
  # .env 加载
  # --------------------------------------------------------------------------
  # optional: 前缀保证文件不存在时应用照常启动——容器里通常不挂载 .env，而是通过
  # docker run --env-file / -e 注入变量，这条路径必须能正常启动。
  #
  # 【.env 格式硬约束】必须写成三家解析器的交集子集，否则容器启动会直接失败：
  #   不能写 export KEY=value  —— Spring Boot 会把 "export" 当键名；docker run --env-file 直接报错退出
  #   不能给值加引号           —— Spring 与 Docker 都会把引号当字面量保留
  #   不能写行尾注释           —— 会被当成值的一部分
  #   只能写 KEY=value，整行 # 注释
  config:
    import: "optional:file:.env[.properties]"

# ============================================================================
# 检测判据
# ============================================================================
app:

  # --------------------------------------------------------------------------
  # 规则检测器的判据
  # --------------------------------------------------------------------------
  # 规则前置这一层：知识库明示"没有这个能力 / 没有这条信息"的案例，
  # 用确定性规则判定，不再调用大模型。
  #
  # 下面这些是【中文客服领域的话术特征】，不是某批数据的答案。放在配置里，
  # 是因为各家话术差别很大：有的平台说"未接入"，有的说"暂未开通"；
  # 有的把退货地址叫"寄回地址"。按自己的知识库措辞调整即可，不用改代码。
  #
  # 正统一律用单引号包裹 —— YAML 单引号内的反斜杠是字面量，正则才能正确转义。
  rules:

    # 知识库声明"系统不具备某项能力"。命中后若回复又声称执行了该动作，即判能力越界。
    capability-absence-markers:
      - "未接入"
      - "不具备"
      - "需人工后台操作"
      - "需转人工处理"

    # 知识库声明"没有记录这条信息"。
    info-absence-markers:
      - "未标注"
      - "未提及"

    # "无 X"构词的停用词表。
    # 中文里"无"既可以是存在否定（"无此政策"），也可以是构词成分（"7天无理由退货"）。
    # 不排掉后者，知识库里的"7天无理由退货"会被误读成"本店没有退货政策"。
    existence-negation-stoplist:
      - "无理由"
      - "无门槛"
      - "无接触"
      - "无忧"
      - "无感"
      - "无限"

    # 声称已经执行了某个动作。这类动词要求系统真的接了对应接口。
    action-assertion-pattern: '(我|己|已|已经)?\s*(帮|给|为)?\s*您?\s*(查|查询|修改|改|升级|提交|处理|安排|发送|发到)|已(经)?(帮您|为您|将|把)'

    # 肯定断言的开场白。回复以此开头，等于对知识库的否定声明做了正面肯定。
    affirmative-assertion-pattern: '是的|有的|可以的|支持的|当然可以|没问题|确实'

    # 知识库中的禁止性表述。
    prohibition-pattern: '不可|不得|禁止'

    # 上述禁止所约束的对象必须也出现在知识库里，才认为禁止与本条披露相关。
    prohibition-subject: "地址"

    # 具体地址与邮编的形态。知识库禁止披露而回复给出了，即构成违规披露。
    address-like-pattern: '[^，。；]{1,8}省[^，。；]{1,8}市[^，。；]{1,10}(区|县|路)'
    postcode-like-pattern: '邮\s*编\s*\d{6}'

    # 客观事实类对象的关键词，用于把幻觉归入"参数事实编造"。
    fact-keywords:
      - "门店"
      - "品牌"
      - "参数"
      - "材质"
      - "成分"
      - "接口"
      - "功能"
      - "规格"
      - "颜色"
      - "尺码"

    # 业务规则类对象的关键词，用于把幻觉归入"政策规则编造"。
    policy-keywords:
      - "政策"
      - "优惠"
      - "活动"
      - "退货"
      - "发票"
      - "支付"
      - "发货"
      - "快递"
      - "保修"
      - "运费"
      - "券"
      - "折扣"

    # 触发 S1 的关键词：健康风险、材质欺诈、不可逆的物流操作。
    # 严重度只升不降，命中这些词时把类型基线往 S1 抬。
    severity-escalation-keywords:
      - "孕妇"
      - "哺乳"
      - "医生"
      - "健康"
      - "过敏"
      - "材质"
      - "成分"
      - "牛皮"
      - "真皮"
      - "羊绒"
      - "皮革"
      - "仓库"
      - "寄到"
      - "收件"
      - "退货地址"

server:
  port: "${SERVER_PORT:8080}"
